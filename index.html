
<!DOCTYPE html>
<html>
<head>
<title>My Calculator</title>
<style>
body {
  font-family: Arial;
  background: #e9e9f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 90vh;
}
.calculator {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 280px;
  box-shadow: 0 4px 15px #aaa;
}
h2 { text-align: center; }
#display {
  width: 95%;
  height: 50px;
  font-size: 25px;
  text-align: right;
  margin-bottom: 12px;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
button {
  padding: 16px 5px;
  font-size: 20px;
  border: none;
  border-radius: 7px;
  background: #e4e4f5;
}
.operator { background: #b9a8f5; }
.equal { background: #6558d3; color: white; }
</style>
</head>
<body>
<div class="calculator">
<h2>My Calculator</h2>
<input id="display" readonly>
<div class="buttons">
<button onclick="clearDisplay()">C</button>
<button onclick="append('/')">÷</button>
<button onclick="append('*')">×</button>
<button onclick="removeLast()">⌫</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button class="operator" onclick="append('-')">−</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button class="operator" onclick="append('+')">+</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button class="equal" onclick="calculate()">=</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
</div>
</div>

<script>
function append(value) {
  document.getElementById("display").value += value;
}
function clearDisplay() {
  document.getElementById("display").value = "";
}
function removeLast() {
  let d = document.getElementById("display");
  d.value = d.value.slice(0, -1);
}
function calculate() {
  let d = document.getElementById("display");
  try {
    if (!/^[0-9+\-*/. ]+$/.test(d.value)) throw Error();
    let result = Function('"use strict"; return (' + d.value + ')')();
    d.value = Number.isFinite(result) ? result : "Error";
  } catch {
    d.value = "Error";
  }
}
</script>
</body>
</html>
